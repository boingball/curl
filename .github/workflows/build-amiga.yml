name: Build AmigaOS

# Compile the AmigaOS curl port on changes to the amigaos branch.
# This is a CI compile sanity check. Release binaries should still be made
# with the known-good GCC 13.2 toolchain documented in README-AmigaOS.md and
# docs/AMIGAOS.md and then tested on AmigaOS.

on:
  push:
    branches: ["amigaos"]
  pull_request:
    branches: ["amigaos"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Compile 68030 curl with the Amiga SDK
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e USER=$(id -u) -e GROUP=$(id -g) \
            sacredbanana/amiga-compiler:m68k-amigaos \
            bash -c '
              set -e
              AMIGA_GCC="$(command -v m68k-amigaos-gcc)"
              AMIGA_PREFIX="$(dirname "$(dirname "$AMIGA_GCC")")"
              echo "Compiler: $AMIGA_GCC"
              echo "Toolchain prefix: $AMIGA_PREFIX"
              "$AMIGA_GCC" --version | head -1

              # This Docker SDK keeps third-party headers/libraries such as
              # zlib under $AMIGA_PREFIX/usr. The release builder accepts
              # optional explicit SDK search flags while leaving normal
              # known-good release builds unchanged when they are unset.
              export AMIGA_CPPFLAGS="-I$AMIGA_PREFIX/usr/include"
              export AMIGA_LDFLAGS="-L$AMIGA_PREFIX/usr/lib"

              if ! make -f Makefile.amiga 030 AMIGA_PREFIX="$AMIGA_PREFIX" PACKAGE=0; then
                echo "===== build-amiga/030/config.log ====="
                cat build-amiga/030/config.log 2>/dev/null || true
                exit 1
              fi
            '

      - name: Confirm the Amiga outputs were produced
        run: |
          find dist-amiga -maxdepth 2 -type f -print | sort
          test -n "$(find dist-amiga -type f -name 'curl.030' -print -quit)"
          test -n "$(find dist-amiga -type f -name 'libcurl.a.030' -print -quit)"
          file $(find dist-amiga -type f -name 'curl.030' -print -quit) || true

      - name: Upload compiled 68030 release drawer
        uses: actions/upload-artifact@v4
        with:
          name: curl-68030-AmigaOS
          path: dist-amiga/curl-*-amigaos/
          if-no-files-found: error
